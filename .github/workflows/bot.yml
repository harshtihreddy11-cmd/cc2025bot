name: cc2025 Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: cc2025-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write and validate config files
        env:
          PORTAL_CONFIG_JSON: ${{ secrets.PORTAL_CONFIG_JSON }}
          BOT_CONFIG_JSON: ${{ secrets.BOT_CONFIG_JSON }}
        run: |
          set -eu
          test -n "$PORTAL_CONFIG_JSON" || { echo "::error::Add the PORTAL_CONFIG_JSON repository secret."; exit 1; }
          test -n "$BOT_CONFIG_JSON" || { echo "::error::Add the BOT_CONFIG_JSON repository secret."; exit 1; }
          printf '%s' "$PORTAL_CONFIG_JSON" > config.json
          printf '%s' "$BOT_CONFIG_JSON" > bot_config.json
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("config.json", "bot_config.json"):
              with Path(name).open() as config_file:
                  data = json.load(config_file)
              if not isinstance(data, dict):
                  raise SystemExit(f"{name} must contain a JSON object")

          with Path("bot_config.json").open() as config_file:
              bot_config = json.load(config_file)
          if not isinstance(bot_config.get("bot_token"), str) or not bot_config["bot_token"].strip():
              raise SystemExit("bot_config.json must contain a non-empty bot_token")
          bot_config["local_bot_api_url"] = "http://127.0.0.1:8081"
          Path("bot_config.json").write_text(json.dumps(bot_config))
          PY

      - name: Start Local Bot API Server
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -eu
          test -n "$TELEGRAM_API_ID" || { echo "::error::Add the TELEGRAM_API_ID repository secret."; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "::error::Add the TELEGRAM_API_HASH repository secret."; exit 1; }
          docker run --detach \
            --name telegram-bot-api \
            --publish 127.0.0.1:8081:8081 \
            --env TELEGRAM_API_ID \
            --env TELEGRAM_API_HASH \
            --env TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:latest
          python - <<'PY'
          import socket
          import time

          for _ in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 8081), timeout=1):
                      print("Local Bot API Server is listening.")
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Local Bot API Server failed to start.")
          PY

      - name: Run bot (stops gracefully after 5h50m)
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 350m python bot.py
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
